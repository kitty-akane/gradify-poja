<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion HEI</title>

    <link rel="stylesheet" th:href="@{/hei-theme.css}">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-header">

            <div class="login-logo">
                HEI
            </div>

            <h1>Connexion</h1>

            <p class="login-subtitle">
                Accédez à votre espace HEI
            </p>

        </div>
        <p
                th:if="${error}"
                th:text="${error}"
                class="alert-error">
        </p>
        <form method="post" th:action="@{/thymeleaf/login}">

            <div class="form-group">
                <label for="email">
                    Email
                </label>

                <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="votre.email@hei.school"
                        required>
            </div>

            <div class="form-group">
                <label for="password">
                    Mot de passe
                </label>

                <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        required>
            </div>
            <button
                    type="submit"
                    class="btn-primary">
                Se connecter
            </button>

        </form>

    </div>

</div>

</body>
</html>
